name: Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: '3.13'

jobs:
  # Job 1: Linting and type checking (Windows only)
  # Code quality checks are identical regardless of OS
  lint-and-check:
    name: Lint and Type Check
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src

      - name: Type check with mypy
        run: mypy src --ignore-missing-imports

  # Job 2: CLI and utility testing (Windows & Ubuntu)
  # Tests CLI functionality and non-GUI code
  test-cli:
    name: Test CLI
    needs: lint-and-check
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run CLI tests (exclude GUI tests)
        run: |
          python -m pytest tests/ -m 'not gui' -v

      - name: Collect test coverage (Windows only)
        if: runner.os == 'Windows'
        run: |
          python -m pytest tests/ -m 'not gui' --cov=src --cov-report=html:htmlcov --cov-report=term

      - name: Upload coverage report (Windows only)
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: htmlcov/
          retention-days: 7

      - name: Test executable permissions and structure  
        run: |
          python -c "
          import os
          import sys
          
          # Check main entry points exist
          assert os.path.exists('src/main.py'), 'main.py not found'
          assert os.path.exists('src/config.ini'), 'config.ini not found'
          assert os.path.exists('main.spec'), 'main.spec not found'
          
          # Check key modules exist
          key_files = [
              'src/models/log_model.py',
              'src/models/request_model.py', 
              'src/ui/app_window.py',
              'src/ui/log_window.py',
              'src/ui/request_window.py',
              'src/utils/config_manager.py',
              'src/utils/file_utils.py'
          ]
          
          for file in key_files:
              assert os.path.exists(file), f'{file} not found'
          
          print('[OK] All required files present')
          "

      - name: Clean up test files
        run: |
          rm -rf test_file.txt test_folder test_logs test_requests 2>/dev/null || true
        shell: bash

  # Job 3: GUI testing (Windows only)
  # PySide6 tests require display server
  test-gui:
    name: Test GUI
    needs: lint-and-check
    
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run GUI tests only
        run: |
          python -m pytest tests/ -m 'gui' -v

      - name: Test GUI can start
        run: |
          # Test GUI startup with 5-second timeout
          $process = Start-Process python -ArgumentList "src/main.py", "--tab", "0" -PassThru
          Start-Sleep -Seconds 5
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Write-Output "GUI startup test completed"
        shell: powershell

  # Job 4: Version update (main branch only)
  # Only update version for commits to main branch
  update-version:
    name: Update Version
    needs: [test-cli, test-gui]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Update Version Information
        run: |
          mkdir -p src
          python scripts/update_version.py

      - name: Commit updated version
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add version.txt src/version.py
          git diff --staged --quiet || git commit -m "Auto-increment build number [skip ci]"
          git push

  # Job 5: Build executables (Windows, Ubuntu, RHEL8/9/10)
  # Depends on all testing completing (version update is optional on main branch)
  build:
    name: Build Executable
    needs: [lint-and-check, test-cli, test-gui]
    if: always() && (needs.lint-and-check.result == 'success' && needs.test-cli.result == 'success' && needs.test-gui.result == 'success')
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, rhel9]
        include:
          - os: windows-latest
            artifact-name: dta-transfer-log-windows
          - os: ubuntu-latest
            artifact-name: dta-transfer-log-ubuntu
          - os: rhel8
            artifact-name: dta-transfer-log-rhel9
          - os: rhel9
            artifact-name: dta-transfer-log-rhel9
          - os: rhel10
            artifact-name: dta-transfer-log-rhel10

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        if: matrix.os != 'rhel8' && matrix.os != 'rhel9' && matrix.os != 'rhel10'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Python on RHEL
        if: matrix.os == 'rhel8' || matrix.os == 'rhel9' || matrix.os == 'rhel10'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "rhel8" ]; then
            PY_VER="3.12"
          else
            PY_VER="${{ env.PYTHON_VERSION }}"
          fi
          PYTHON_CMD="python${PY_VER}"

          # Ensure EPEL repository exists
          if ! dnf repolist enabled | grep -q epel; then
            echo "Installing EPEL repository..."
            if [ "${{ matrix.os }}" = "rhel8" ]; then
              sudo dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm
            elif [ "${{ matrix.os }}" = "rhel9" ]; then
              sudo dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
            else
              sudo dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
            fi
          else
            echo "EPEL repository is already available"
          fi

          # Check if Python is already installed
          if ! command -v $PYTHON_CMD &> /dev/null; then
            echo "Installing Python ${PY_VER}..."
            sudo dnf install -y python${PY_VER} python${PY_VER}-pip python${PY_VER}-devel
          else
            echo "Python ${PY_VER} is already installed"
          fi
          $PYTHON_CMD --version

          # Create and activate virtual environment
          $PYTHON_CMD -m venv venv
          source venv/bin/activate
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      - name: Extract version
        id: version
        shell: bash
        run: |
          # Activate venv on RHEL9
          if [[ "${{ matrix.os }}" =~ ^rhel(8|9|10)$ ]]; then
            source venv/bin/activate
          fi
          
          python_cmd="python"
          if [[ "${{ matrix.os }}" =~ ^rhel(8|9|10)$ ]]; then
            python_cmd="python${{ env.PYTHON_VERSION }}"
          fi
          
          $python_cmd << 'EOF'
          import os
          import re
          import subprocess

          def write_output(key, value):
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"{key}={value}\n")

          # Read version.py
          version = "unknown"
          version_short = "unknown"
          try:
            with open('src/version.py', 'r', encoding='utf-8') as f:
              content = f.read()
            match = re.search(r'VERSION = "([^"]+)"', content)
            if match:
              version = match.group(1)
              parts = version.split('.')
              # Use short semver (major.minor.patch)
              if len(parts) >= 3:
                version_short = '.'.join(parts[:3])
              else:
                version_short = version
          except Exception as e:
            print(f"Warning: Could not read version.py: {e}")

          # Get git commit (short)
          commit_short = "unknown"
          try:
            commit_full = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
            commit_short = commit_full[:7]
          except Exception as e:
            print(f"Warning: Could not get git commit: {e}")

          write_output('version', version)
          write_output('version_short', version_short)
          write_output('commit_short', commit_short)

          print(f"Version: {version} (short: {version_short}, commit: {commit_short})")
          EOF

      - name: Install Qt runtime dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1 \
            libxcb-util1 \
            libxcb-randr0 \
            libxcb-xinerama0 \
            libxcb1 \
            libxkbcommon0 \
            libxcb-render0 \
            libxcb-shm0 \
            libtiff6 \
            libgtk-3-0

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        shell: bash
        run: |
          echo "Starting PyInstaller build..."
          pyinstaller main.spec
          echo "Build completed. Checking dist directory..."
          ls -la dist/
          
          # Check if executables exist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            if [[ ! -f "dist/dtatransferlog.exe" ]]; then
              echo "ERROR: dtatransferlog.exe not found!"
              ls -la dist/
              exit 1
            fi
            if [[ ! -f "dist/dtatransferlog-cli.exe" ]]; then
              echo "ERROR: dtatransferlog-cli.exe not found!"
              ls -la dist/
              exit 1
            fi
          else
            if [[ ! -f "dist/dtatransferlog" ]]; then
              echo "ERROR: dtatransferlog not found!"
              ls -la dist/
              exit 1
            fi
          fi

      - name: Test built executable
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          echo "Testing built executable..."
          
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Test GUI executable
            if [[ -f "./dist/dtatransferlog.exe" ]]; then
              echo "Testing GUI executable..."
              ./dist/dtatransferlog.exe --version
            else
              echo "ERROR: dtatransferlog.exe not found in dist/"
              exit 1
            fi
            # Test CLI executable
            if [[ -f "./dist/dtatransferlog-cli.exe" ]]; then
              echo "Testing CLI executable..."
              ./dist/dtatransferlog-cli.exe --version
            else
              echo "ERROR: dtatransferlog-cli.exe not found in dist/"
              exit 1
            fi
          else
            # Test Linux executable (version only to avoid GUI)
            if [[ -f "./dist/dtatransferlog" ]]; then
              echo "Testing Linux executable..."
              chmod +x ./dist/dtatransferlog
              ./dist/dtatransferlog --version
            else
              echo "ERROR: dtatransferlog not found in dist/"
              exit 1
            fi
          fi

      - name: Verify dist directory
        shell: bash
        run: ls -la dist

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-v${{ steps.version.outputs.version_short }}-${{ steps.version.outputs.commit_short }}
          path: dist/
          retention-days: 7
