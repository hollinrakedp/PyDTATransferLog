name: Build Executable

on:
  workflow_dispatch:
  #push:
  #  branches:
  #    - main  # Trigger the workflow on pushes to the 'main' branch
  #pull_request:
  #  branches:
  #    - main  # Trigger the workflow on pull requests to the 'main' branch

env:
  PYTHON_VERSION: '3.13'

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version tracking

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Update Version Information
        run: |
          mkdir -p src
          python scripts/update_version.py

      - name: Commit updated version
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add version.txt src/version.py
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Auto-increment build number [skip ci]"
          git push

  build:
    needs: update-version
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, rhel9]
        include:
          - os: windows-latest
            artifact-name: dta-transfer-log-windows
          - os: ubuntu-latest
            artifact-name: dta-transfer-log-ubuntu
          - os: rhel8
            artifact-name: dta-transfer-log-rhel8
          - os: rhel9
            artifact-name: dta-transfer-log-rhel9
          - os: rhel10
            artifact-name: dta-transfer-log-rhel10

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # Step 2: Set up Python
      - name: Set up Python
        if: matrix.os != 'rhel8' && matrix.os != 'rhel9' && matrix.os != 'rhel10'
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Step 2: Setup Python (RHEL8/9/10, self-hosted)
      - name: Setup Python on RHEL
        if: matrix.os == 'rhel8' || matrix.os == 'rhel9' || matrix.os == 'rhel10'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "rhel8" ]; then
            PY_VER="3.12"
          else
            PY_VER="${{ env.PYTHON_VERSION }}"
          fi
          PYTHON_CMD="python${PY_VER}"

          # Ensure EPEL repository
          if ! dnf repolist enabled | grep -q epel; then
            echo "Installing EPEL repository..."
            if [ "${{ matrix.os }}" = "rhel8" ]; then
              sudo dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm
            elif [ "${{ matrix.os }}" = "rhel9" ]; then
              sudo dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
            else
              sudo dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
            fi
          else
            echo "EPEL repository is already available"
          fi

          # Check if Python is already installed
          if ! command -v $PYTHON_CMD &> /dev/null; then
            echo "Installing Python ${PY_VER}..."
            sudo dnf install -y python${PY_VER} python${PY_VER}-pip python${PY_VER}-devel
          else
            echo "Python ${PY_VER} is already installed"
          fi
          $PYTHON_CMD --version

          # Create and activate virtual environment
          $PYTHON_CMD -m venv venv
          source venv/bin/activate
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      # Step 3: Install dependencies
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # Step 4: Build the executable
      - name: Build executable with PyInstaller
        run: |
          pyinstaller main.spec

      # Step 5: Verify the dist directory
      - name: Verify dist directory
        shell: bash
        run: ls -la dist

      # Step 6: Upload the executable as an artifact
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/
          retention-days: 7
