[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    gui: marks tests that require GUI components
    cli: marks tests for CLI functionality